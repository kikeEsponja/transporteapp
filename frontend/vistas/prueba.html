<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="../icons/carro.png">
    <title>transport</title>
    <style>
        /* Contenedor del loader */
        .loader-container {
          position: relative;
          width: 160px;
          height: 80px;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          align-items: center;
        }

        /* --- El Automóvil --- */
        .car {
          position: relative;
          width: 100px;
          height: 40px;
          margin-bottom: 6px; /* Separación respecto a la pista */
        }

        /* Cuerpo del auto */
        .car-body {
          position: absolute;
          bottom: 10px;
          width: 100%;
          height: 20px;
          background-color: #3b82f6; /* Color de la carrocería */
          border-radius: 6px 12px 4px 4px;
        }

        /* Techo / Cabina */
        .car-top {
          position: absolute;
          top: -12px;
          left: 20px;
          width: 50px;
          height: 14px;
          background-color: #3b82f6;
          border-radius: 10px 10px 0 0;
        }

        /* Ruedas con efecto de rotación */
        .wheel {
          position: absolute;
          bottom: 2px;
          width: 18px;
          height: 18px;
          background-color: #1e293b;
          border: 3px solid #e2e8f0;
          border-radius: 50%;
          z-index: 2;
          animation: spin 0.5s linear infinite;
        }

        .wheel-left { left: 12px; }
        .wheel-right { right: 12px; }

        /* --- El Suelo (Simulador de movimiento) --- */
        .road {
          width: 100%;
          height: 4px;
          border-radius: 2px;
          /* Fondo discontinuo (punteado) que se repite */
          background: repeating-linear-gradient(
            90deg,
            #94a3b8,
            #94a3b8 12px,
            transparent 12px,
            transparent 20px
          );
          background-size: 40px 100%;
          animation: moveRoad 0.4s linear infinite;
        }

        /* --- Animaciones --- */
            
        /* Mueve el fondo del suelo hacia la izquierda */
        @keyframes moveRoad {
          0% {
            background-position: 0 0;
          }
          100% {
            background-position: -40px 0;
          }
        }
        
        /* Giro de ruedas */
        @keyframes spin {
          100% {
            transform: rotate(360deg);
          }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="car">
        <!-- Chasis -->
            <div class="car-body">
                <div class="car-top"></div>
            </div>
            <!-- Ruedas -->
            <div class="wheel wheel-left"></div>
            <div class="wheel wheel-right"></div>
        </div>
        <!-- Suelo en movimiento -->
        <div class="road"></div>
    </div>
</body>
</html>
