<form id="form-adm-usuario">
    <div>
        <label for="nombre-usuario">Ingrese nombre</label>
        <input class="form-control h-25" type="text" id="nombre-usuario" name="nombre-usuario" required>
        <label for="apellido-usuario">Ingrese apellido</label>
        <input class="form-control h-25" type="text" id="apellido-usuario" name="apellido-usuario" required>
        <label for="tel-usuario">Ingrese número de teléfono</label>
        <input class="form-control h-25" type="tel" id="tel-usuario" name="tel-usuario" required>
    </div>
    <div>
        <label for="email-usuario">Correo electrónico</label>
        <input class="form-control h-25" type="email" id="email-usuario" name="email-usuario" required>
        <label for="password-usuario">Contraseña</label>
        <input class="form-control h-25" type="password" id="password-usuario" name="password-usuario" required>
        <label for="rol-usuario">Rol</label>
        <input class="form-control h-25" type="text" id="rol-usuario" name="rol-usuario" required>
    </div>
    <button type="submit" id="boton-reg-usuario" class="btn btn-primary">Crear usuario</button>
</form>
