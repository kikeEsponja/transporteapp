<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/transp.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="../icons/carro.png">
    <title>transport</title>
</head>
<body>
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Solicitud de restablecimiento de password</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="publicar-modal">
                    <p>Ingrese su correo electrónico</p>
                    <label for="email-recup">Correo electrónico</label>
                    <input type="email" id="email-recup" name="email-recup">
                    <p id="mensaje"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="enviar-solicitud-recup">Aceptar</button>
                </div>
            </div>
        </div>
    </div>
    <center>
            <h1>Iniciar sesión</h1>

            <div class="contenedor-elementos">
                <form id="form-login">

                    <label for="email">Correo electrónico</label>
                    <input class="form-control" type="email" id="email" name="email" required>

                    <label for="password">Contraseña</label>
                    <input class="form-control" type="password" id="password" name="password" required>

                    <button type="submit" class="btn btn-primary">Iniciar sesión</button>
                    <p>decimosexta actualización</p>

                    <p id="mensaje"></p>
                </form>

                <p>¿Olvidaste tu contraseña?</p>
                <!--<button id="ir_solicitud-recup" type="button" class="btn btn-primary">Click aquí</button>-->
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Click aquí</button>

                <p>¿No tienes cuenta?</p>
                <button id="ir_registro" type="button" class="btn btn-primary">Registrarse</button>
            </div>
    </center>

    <script src="../js/auth.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
