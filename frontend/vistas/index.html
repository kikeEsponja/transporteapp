<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../icons/carro.png">
    <link rel="stylesheet" href="../css/transp.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>OnRoadSystem</title>
    <style>
        .carrusel{
            background: #00f;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 35px;
            overflow: hidden;
        }
        .carrusel-inner{
            display: flex;
            justify-content: space-around;
        }
        .carrusel-item{
            display: flex;
            width: 100%;
            height: 35px;
            position: relative;
            align-items: center;
            justify-content: center;
            margin: 1%;
        }
        .frame{
            background: #ff0;
            border: 2px solid #000;
            width: 100%;
            height: 30px;
            position: absolute;
        }
        /*@keyframes movimiento{
            from{
                right: 0;
                left: 400px;
            }
            to{
                right: 400px;
                left: -390px;
            }
        }*/
    </style>
</head>
<body>
    <center>    
        <div class="contenedor-elementos text-light">
            <img src="../img/logo.jpeg" class="logo" alt="logo" id="logo">
            <h1 class="text-center">ON ROAD SYSTEM 1.0</h1>
            <h2 class="text-center">Bienvenido a la plataforma</h2>
            <div>
                <p>Acceda con sus credenciales</p> 
                <button class="btn btn-outline-success w-100 text-light" id="btn-login">Login</button>
                <!--<a class="btn btn-outline-success w-100 text-light" href="./login.html">Login</a>-->
            </div>
            <h4>O</h4>
            <div>
                <p>Regístrese como nuevo usuario</p>
                <button class="btn btn-outline-success w-100 text-light" id="btn-registro">Registro</button>
                <!--<a class="btn btn-outline-success w-100 text-light" href="./registro.html">Registro</a>-->
            </div>
            <br>
            <div class="loader-container" id="loader-container">
                <div class="car">
                    <!-- Chasis -->
                    <div class="car-body">
                        <div class="car-top"></div>
                    </div>
                    <!-- Ruedas -->
                    <div class="wheel wheel-left"></div>
                    <div class="wheel wheel-right"></div>
                </div>
                <!-- Suelo en movimiento -->
                <div class="road"></div>
            </div>
            <div class="contenedor-carrusel">
                <div class="carrusel">                
                    <div class="carrusel-inner">
                    
                        <div class="carrusel-item">
                            <div class="frame">Cargando el sistema...</div>
                        </div>

                        <div class="carrusel-item">
                            <div class="frame">Estableciendo conexión...</div>
                        </div>

                        <div class="carrusel-item">
                            <div class="frame">Casi listo...</div>
                        </div>
                    
                    </div>
                </div>
            </div>
        </div>
    </center>

    <script src="../js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
