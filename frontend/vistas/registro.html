<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/transp.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="../icons/carro.png">
    <title>transport</title>
</head>
<body>
    <center>
            <h1>Registro de usuario</h1>

            <div class="contenedor-elementos">
                <form id="form-registro">
                    <div>
                        <label for="nombre">Ingrese su nombre</label>
                        <input class="form-control h-25" type="text" id="nombre" name="nombre" required>

                        <label for="apellido">Ingrese su apellido</label>
                        <input class="form-control h-25" type="text" id="apellido" name="apellido" required>

                        <label for="tel">Ingrese su número de teléfono</label>
                        <input class="form-control h-25" type="tel" id="tel" name="tel" required>
                    </div>

                    <div>
                        <label for="email">Correo electrónico</label>
                        <input class="form-control h-25" type="email" id="email" name="email" required>

            
                        <label for="password">Contraseña</label>
                        <input class="form-control h-25" type="password" id="password" name="password" required>

                        <label for="password-rep">Repita la contraseña</label>
                        <input class="form-control h-25" type="password" id="password-rep" name="password-rep" required>
                    </div>
           
                    <button type="submit" id="boton-reg" class="btn btn-primary">Registrarse</button>
                </form>

                <p>¿Ya tienes cuenta?</p>
                <button id="ir_login" type="button" class="btn btn-primary">Login</button>
            </div>
    </center>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formulario = document.getElementById('form-registro');

            formulario.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const nombre = document.getElementById('nombre').value.trim();
                const apellido = document.getElementById('apellido').value.trim();
                const telefono = document.getElementById('tel').value.trim();
                const email = document.getElementById('email').value.trim();
                const pass = document.getElementById('password').value.trim();
                const passrep = document.getElementById('password-rep').value.trim();

                if(pass !== passrep){
                    alert('Las contraseñas no coinciden');
                    return;
                }

                try{
                    const res = await registro(nombre, apellido, email, pass, telefono);
        
                    alert('usuario registrado con éxito');

                    window.location.href = './login.html';
                }catch(error){
                    console.error('Error en el registro: ', error);
                    alert(error.message || 'Error al registrar usuario');
                }
            });

            document.getElementById('ir_login').addEventListener('click', () => {
                window.location.href = './login.html';
            });
        });
    </script>
</body>
</html>
